name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows" ]; then
            go build -trimpath -ldflags "-s -w" -o release/vaibe-os.exe ./cmd/vaibe-os
            (cd release && zip -q "vaibe-os_${{ github.ref_name }}_windows_amd64.zip" vaibe-os.exe)
          else
            go build -trimpath -ldflags "-s -w" -o release/vaibe-os ./cmd/vaibe-os
            (cd release && tar -czf "vaibe-os_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" vaibe-os)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: "release-${{ matrix.os }}-${{ matrix.arch }}"
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
